<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="add">
<header>
<div class="logo">STUDENT PORTAL</div>
<nav>

</nav>
</header>
<main>
<section class="app-page visible" id="page-add">
<div class="page-title"><h1>Add New Student</h1><p>Add a complete student record.</p></div>
<div class="form-box"><h2>Personal Information</h2><div class="form-grid">
<div><label>Full Name</label><input id="name" type="text"/></div><div><label>Roll Number</label><input id="roll" type="text"/></div>
<div><label>Date of Birth</label><input id="dob" type="date"/></div><div><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Mobile Number</label><input id="mobile" type="text"/></div><div><label>Email</label><input id="email" type="email"/></div>
<div class="full-width"><label>Address</label><textarea id="address"></textarea></div>
<div><label>Profile Photo</label><input accept="image/*" id="photo" type="file"/></div><div><label>Status</label><select id="status"><option>Active</option><option>Inactive</option></select></div>
</div></div>
<div class="form-box"><h2>Academic Information</h2><div class="form-grid">
<div><label>Course</label><select id="course"><option>B.Tech CSE</option><option>B.Tech IT</option><option>BCA</option><option>MCA</option></select></div>
<div><label>Semester</label><select id="semester"><option>1</option><option selected="">2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<div><label>Division</label><input id="division" value="A"/></div><div><label>Admission Date</label><input id="admissionDate" type="date"/></div>
</div></div>
<div class="form-box"><h2>Parent / Guardian</h2><div class="form-grid">
<div><label>Parent Name</label><input id="parentName"/></div><div><label>Parent Contact</label><input id="parentContact"/></div>
</div></div>
<button class="gold-button" onclick="addNewStudent()">Save Student</button>
</section>
</main>
<footer><p>© Student Management &amp; Attendance Portal(WEBSITE)</p></footer>
<script src="js/app.js"></script>
</body>
</html>
